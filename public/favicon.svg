<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Road to Doomsday">
  <!--
    The route, reduced to its two defining marks: the rail you travel and the
    Latverian terminus it ends at.

    The terminus is filled rather than outlined on purpose. An outlined diamond
    tested at 16px sampled #322415 along its edge — the stroke was thinner than
    a pixel and antialiasing swallowed the gold entirely. Solid shapes with
    heavy strokes are the only thing that survives a tab strip.

    Colours are the app's own: shell #0b0908, green #2f6b45, gold #a8763e.
  -->
  <rect width="32" height="32" rx="7" fill="#0b0908"/>

  <!-- The rail. -->
  <path d="M2 16 H30" stroke="#2f6b45" stroke-width="4" stroke-linecap="round"/>

  <!-- Terminus, sat on the rail. -->
  <rect x="9.5" y="9.5" width="13" height="13" rx="1.5"
        transform="rotate(45 16 16)"
        fill="#a8763e"/>

  <!-- Punched centre, so it reads as a node rather than a blob. -->
  <rect x="13.75" y="13.75" width="4.5" height="4.5"
        transform="rotate(45 16 16)"
        fill="#0b0908"/>
</svg>
