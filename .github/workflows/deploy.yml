name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a redeploy without a new commit.
  workflow_dispatch:

# Read the repo, mint the Pages deployment token.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish rather than cancelling it, so a deploy is never left
# half-applied — but only queue one waiting run at a time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run build` typechecks before bundling, so a type error fails the
      # deploy rather than shipping.
      #
      # Supabase credentials come from repository secrets. They are compiled
      # into the bundle and therefore public — which is fine for the anon key,
      # since Row Level Security is what protects user rows. Using secrets
      # keeps them out of git history rather than out of the bundle. If the
      # secrets are unset the build still succeeds and ships the local-only
      # app, so a fork does not need a Supabase project.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
